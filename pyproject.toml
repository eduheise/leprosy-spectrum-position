[project]
name = "leprosy-similarity"
version = "1.0.0"
description = "Position of a leprosy case on the Ridley-Jopling spectrum from its similarity to specialist reference cases."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# Numerical libraries are pinned to the versions that produced the published
# results, so a rerun reproduces every number exactly.
dependencies = [
    "catboost==1.2.10",
    "joblib==1.5.3",
    "lightgbm==4.6.0",
    "matplotlib==3.10.8",
    "miceforest==6.0.5",
    "numpy==2.4.3",
    "openpyxl==3.1.5",
    "optuna==4.9.0",
    "pandas==3.0.1",
    "pyarrow==23.0.1",
    "pyyaml==6.0.3",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "shapley-values",
    "xgboost==3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv.sources]
shapley-values = { path = "../shapley_values" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leprosy_similarity"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
